<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SM-1 app icon (design source of truth). GC-1 language: dark faceplate, three 1U rack slots, one LED each.
       LED colours are the state-variable part: app icon = green, green, amber.
       Tray variants swap LED fills only (see tools/make_icons.py). -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e42"/>
      <stop offset="1" stop-color="#1b1d1f"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0f10"/>
      <stop offset="1" stop-color="#17191a"/>
    </linearGradient>
  </defs>
  <!-- faceplate -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#face)" stroke="#000" stroke-width="8"/>
  <rect x="40" y="36" width="432" height="6" rx="3" fill="#5a6066" opacity="0.6"/>
  <!-- screws -->
  <circle cx="76" cy="76" r="14" fill="#777"/><circle cx="436" cy="76" r="14" fill="#777"/>
  <circle cx="76" cy="436" r="14" fill="#777"/><circle cx="436" cy="436" r="14" fill="#777"/>
  <!-- three rack slots -->
  <rect x="104" y="112" width="304" height="80" rx="14" fill="url(#slot)" stroke="#000" stroke-width="6"/>
  <rect x="104" y="216" width="304" height="80" rx="14" fill="url(#slot)" stroke="#000" stroke-width="6"/>
  <rect x="104" y="320" width="304" height="80" rx="14" fill="url(#slot)" stroke="#000" stroke-width="6"/>
  <!-- LCD-ish bars (dim) -->
  <rect x="200" y="142" width="176" height="20" rx="4" fill="#2c3033"/>
  <rect x="200" y="246" width="176" height="20" rx="4" fill="#2c3033"/>
  <rect x="200" y="350" width="176" height="20" rx="4" fill="#2c3033"/>
  <!-- LEDs: glow then core -->
  <circle cx="152" cy="152" r="38" fill="#38ff7a" opacity="0.22"/><circle cx="152" cy="152" r="24" fill="#38ff7a"/>
  <circle cx="152" cy="256" r="38" fill="#38ff7a" opacity="0.22"/><circle cx="152" cy="256" r="24" fill="#38ff7a"/>
  <circle cx="152" cy="360" r="38" fill="#ffb000" opacity="0.22"/><circle cx="152" cy="360" r="24" fill="#ffb000"/>
</svg>
